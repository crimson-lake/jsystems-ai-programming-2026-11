# Is Polish the best language for LLMs? Evidence review (as of 24 Nov 2026)

**Verdict: the claim is debunked.** No study shows that prompting in Polish, or in any Slavic language, makes LLMs better than prompting in English.

The 2025 headline came from a single long-context retrieval benchmark (OneRuler). The paper never tested prompting, and its co-author says the Polish–English gap is not statistically significant. Newer controlled evidence (2025–2026) on search, RAG, reasoning and real exams shows the following:

- **English is equal or better in almost every same-task comparison.**
- On **frontier models** the Polish gap is small: 0–6 points, and sometimes Polish wins by about 1 point.
- On **small or open models** the gap is large: 10–20 points.
- Polish text costs **about 1.3–1.9× more tokens**.

| Scope | What the newest evidence says | Strength |
|---|---|---|
| Original claim (OneRuler) | Polish 88% vs English 83.9%, only at 64K–128K context, averaged over 6 models. No significance test, and a different book per language. It measures needle retrieval, not prompting. | Verified in the paper; confounded |
| Search and retrieval | BM25 is weaker in Polish than English on all 11 paired BEIR datasets (−2.4 to −12.5 nDCG@10) | Medium (machine-translated data) |
| RAG | Mixing languages between query and documents is the biggest penalty (−7 to −42 pts Hit@20). LLMs prefer English sources. A 2026 deep-research benchmark loses 16–23 pp on translated corpora, and still loses 5–13 pp even with perfect retrieval. | Medium–strong; Polish rarely tested directly |
| Reasoning | Language affects reasoning through comprehension and the language of thought. Polish on frontier reasoning models: −0.8 to −5.6 pts (mmPISA, 2026). Older open model: GSM8K 0.87 EN vs 0.69 PL. | Medium–strong |
| Real Polish exams (medical) | Human-translated LEK: Llama-3.1-8B 51.3% PL vs 64.7% EN; Llama-70B 80.9 vs 82.6; **GPT-4o 90.0 PL vs 88.7 EN** | Strong (EMNLP 2025 Findings) |
| Other Slavic languages | No evidence of native-language superiority anywhere. Native-prompt effects are small and task-dependent (Slovak, Russian, Ukrainian). | Medium; mostly secondary sources |
| Cost | Polish fertility 2.25 vs English 1.23 tokens/word (6 tokenizers) | Strong |

---

## 1. The original claim, checked against the paper

The cryps.pl article, Euronews (Nov 2025), Polskie Radio and others built on **OneRuler**: Kim, Russell, Karpinska and Iyyer, *One ruler to measure them all*, COLM 2025, arXiv 2503.01996.

The lead model checked the following directly in the arXiv v3 text:

- **What was tested:** 7 synthetic tasks (needle-in-a-haystack variants and word aggregation) at 8K–128K tokens, in 26 languages.
- **Sample size:** 50 examples per configuration, which is 5.2K prompts per task per model.
- **The headline numbers:** *"at context lengths of 64K and 128K, we unexpectedly observe that Polish is the top performer on NIAH tasks"*, with 88% averaged across all models. English is *"only the 6th best language out of the 26"*, at 83.9%. Chinese is 4th from the bottom, at 62.1%.
- **One book per language:** *"26 open-domain non-copyrighted books, one per language"*. Polish used *Noce i dnie*, English used *Little Women*. So the haystack text differs in style, era and length. This book confound is enough on its own to make a 4-point gap uninterpretable.
- **Romance languages lead overall.** The Figure 3 caption says *"Romance languages perform best across all context lengths, along with Polish and Russian."* (The earlier report attributed this to Figure 4. That was corrected here.)
- **Instruction language matters more than the 4-point gap.** Instruction language alone moves accuracy by up to about 20 points. Example: English context at 64K drops from 91% to 71% with Korean instructions.
- **No significance test** is reported for language differences.

**What the co-author said** (Science in Poland / PAP, 27 Nov 2025): the difference was not statistically significant, and the study did not research prompting. *"We certainly cannot conclude"* from it that Polish is best for prompting. Spider's Web reported the same correction.

**What has happened since (2025–2026):** no replication of a Polish-first result was found. The newer long-context benchmarks either omit Polish or find English on top:

- MLRBench (EACL 2026): models use less than 30% of their claimed context.
- MGAL (ICML 2026): covers the six UN languages, so Russian is the only Slavic one.

---

## 2. Search, retrieval and RAG

**Classic retrieval.** BEIR vs BEIR-PL (Wojtasik et al., LREC-COLING 2024, Table 3) uses machine-translated datasets.

- BM25 nDCG@10 is lower in Polish on **all 11 paired datasets**. The gap ranges from 2.4 to 12.5 points (NQ −12.5, HotpotQA −11.0). The average is about 35.7 vs 42.4; that average is our own calculation, not the paper's.
- The authors explain the gap by Polish inflection. Lexical search suffers from it, so lemmatisation and dense or hybrid retrieval matter more in Polish.

**Polish embedders are good within Polish.**

- On PL-MTEB (ACL 2026 Findings), Qwen3-Embedding-8B has the best average (70.47).
- The best *retrieval* score is from the Polish model stella-pl-retrieval-8k: 61.59 vs 59.21.
- On PIRB (41 Polish tasks), multilingual-e5-large averages 57.29.
- Neither benchmark measures a cross-language gap.

**Multilingual RAG behaviour:**

- **Linguistic Nepotism** (Ki et al., ICML 2026): models cite English documents even when they are less relevant. For Russian, the only Slavic language tested, citation accuracy falls by 5.3–12.2 points vs English across six open models.
- **Park & Lee 2025:** retrievers prefer high-resource languages and the query's own language. For example, bge-m3 recall is 45.05 in Russian vs 56.03 in English.
- **The Cross-Lingual Cost** (arXiv 2507.07543; this is about retrieval *bias*, not money):
  - Arabic–English legal RAG loses 7–42 pts Hit@20 when the query and the documents are in different languages (M-E5: 88 same-language vs 46 cross-language).
  - Balanced retrieval recovers about 91–94% of that loss.
- **NEW: XBCP** (*Cross-Lingual BrowseComp-Plus*, Lu et al., arXiv 2606.15345, Jun 2026, preprint) tests deep-research agents on translated evidence. It covers 12 languages and no Slavic ones.
  - With Qwen3-Embedding-8B, accuracy drops by about **16–23 pp** when the corpus is translated.
  - The best system (DeepSeek-V4-Pro) scores 64.7 on the original corpus vs 42.3 cross-lingual.
  - **Even with perfect (oracle) evidence** the drop stays at 4.7–12.8 pp. The model is worse at *reading* evidence in another language, not only at finding it.
- **Polish RAG work in 2026** exists (Bartanowicz & Jassem, LREC 2026; Smits & Walkowiak, EACL 2026 SRW). We could not open the numbers, so we do not cite them. The latest PolEval retrieval task is from 2022.

**Bottom line:** nothing supports "Polish is best for search or RAG". The measurable lever is **language consistency**. Keep queries in the language of the corpus, use a multilingual or Polish embedder with a reranker, and expect generators to favour English sources in mixed indexes.

---

## 3. Can language change an LLM's reasoning level?

**Yes, through two mechanisms. First, how well the model *understands* the input. Second, which language the model *thinks* in. For high-resource languages such as Polish the effect is small on frontier models and large on small ones. No study shows a Slavic language *raising* reasoning above English.**

| Study | Setting | Result |
|---|---|---|
| **mmPISA-bench** (Sapenov & Savelka, CMU, arXiv 2606.07069, Jun 2026) **NEW** | 25 PISA items, official human translations in 43 languages, 5 repetitions | **Claude Opus 4.5 (high effort): EN 100.0 vs PL 94.4. GPT-5.1 (high): EN 96.8 vs PL 96.0. GPT-5.1 (no reasoning): PL 78.4 > EN 76.8.** Reasoning effort raises the mean over all languages from 78.9 to 95.7 (GPT). |
| Thellmann et al. 2024, EU20 | Llama-3.1-70B, DeepL-translated | GSM8K **EN 0.87 vs PL 0.69, CS 0.75** |
| PolyMath (NeurIPS 2025) | 18 languages, no Polish | Reasoning models keep their chain of thought in the input language only 34–43% of the time (non-reasoning models: 99%+). Qwen3-235B thinking: RU ≈ EN (77.6 vs 76.8 at medium level). |
| Tam et al. 2025, *Language Matters* | MATH-500, forced English vs native thinking | English prefill helps Swahili by +31.5 pp on average, Russian by +5.1, and Qwen3/QwQ on Russian by only +0.6 |
| Barua et al. (ICLR 2026) | Long chain of thought, 32B models | Forcing target-language reasoning costs 28.8% on average; AIME 65.5 English CoT vs 24.7 target CoT (Nemotron-49B) |
| Saji et al. 2025, *Reasoning Lingua Franca* | MGSM, GPQA Diamond | Native-language reasoning costs accuracy, and more so for low-resource languages (per-language numbers are only in figures) |
| Yong et al. 2025 | s1-14B | Russian reasoning 92.4 = English 92.4 |
| Liu et al. (NAACL 2025) | ChatGPT | Translating to English helps low-resource math; native prompts are better on culture-related tasks |

**Interpretability** work points the same way: Wendler et al. (ACL 2024), *Semantic Hub* (ICLR 2025) and Anthropic's *Tracing the thoughts* (2025). Models share a mostly language-independent concept space that grows with model size. This explains why the prompt language matters less on larger models.

**Vendor tables:**

- Anthropic's Global-MMLU table (fetched 24 Nov 2026) puts every listed language at **98.5–99.8% of English** for Claude Fable 5.2, and 96.3–99.3% for Opus 5.5. **Polish is not listed.**
- OpenAI's MMMLU covers 14 locales and no Polish.

**Side effect:** for Russian, the attack success rate was 16.1% with Russian prompts vs 11.5% with English ones (Tam et al., Table 3). Safety tuning can be weaker outside English.

---

## 4. Direct Polish evidence (same items, PL vs EN)

**Polish–English medical knowledge transfer** (Grzybowski et al., Adam Mickiewicz University, *Findings of EMNLP 2025*, arXiv 2412.00559) is **the best Polish-specific study found**. It uses Polish medical licensing exams with **professional human English translations** (Table 4):

| Model | LEK PL | LEK EN | LDEK PL | LDEK EN |
|---|---|---|---|---|
| Llama-3.1-8B | 51.25 | 64.69 | 41.06 | 47.71 |
| Llama-3.1-70B | 80.94 | 82.60 | 61.75 | 63.17 |
| GPT-4o | **89.96** | 88.69 | **73.89** | 72.51 |
| GPT-4o-mini | 75.88 | 75.92 | 54.94 | 56.88 |
| Qwen2.5-72B | 76.87 | 81.93 | 58.35 | 63.33 |
| Mistral-Large-2407 | 76.75 | 82.40 | 56.29 | 62.14 |
| Bielik-11B-v2.2 | **62.36** | 56.98 | **43.20** | 42.88 |

Two things stand out:

- **Llama-3.1-8B is far behind in Polish.** It passed one LEK exam in Polish but all 13 in English.
- **GPT-4o and the Polish model Bielik do better in Polish.** The authors: *"language transfer is more effective as the model's general performance improves"*.

Other Polish data points:

- **LLMzSzŁ** (arXiv 2501.02266, ~19k Polish exam questions): models of about 70B parameters perform similarly in Polish and English, while small models do best in their main training language.
- **PLCC** (600 Polish culture questions, 2025): frontier multilingual models lead. Gemini-Exp-1206 scores 83.0, Claude 3.5 Sonnet 82.7, GPT-4o 81.3, and Bielik-2.3 62.2. This measures Polish *knowledge*, not prompt language.
- **MoT-PL** (Wrocław Tech, ICCS 2026): fine-tuning Polish models on Polish reasoning traces improved Polish reasoning but *degraded* English reasoning (up to −45% relative on LightR1). This is a capacity trade-off, not evidence that Polish is better.

---

## 5. Other Slavic languages (searched in their own languages)

We ran about 44 native-language queries in Czech, Slovak, Ukrainian, Russian, Bulgarian, Serbian, Croatian, Slovene and Polish.

Serbian and Croatian got 3–4 queries each because of the budget. They returned only encoder-model benchmarks, so these two languages remain a gap.

| Language | Source | Finding | Confidence |
|---|---|---|---|
| Ukrainian | Galeshchuk et al., UNLP 2026 (347 expert questions) | Large LLMs reach 59.6% at most and small ones 42.1%, with prompts in Ukrainian and in English | Secondary |
| Ukrainian | UNLP 2026 grammar-correction paper | Ukrainian prompts were best for grammar correction; in zero-shot only Claude gained from Ukrainian instructions | Secondary (summary) |
| Russian | MERA Code (arXiv 2507.12284) | Russian vs English prompts: near-zero median difference | Secondary |
| Russian | Russian press (kod.ru, 3dnews) | Repeated the OneRuler ranking with **conflicting numbers** | Press only |
| Slovak | Harvan / Kopčan et al., LoResNLP 2025 | Native Slovak prompts give a small, task-dependent gain; instructions matter more than language | Secondary |
| Bulgarian | BgGPT 1.0 (INSAIT) | The authors state reduced capability when prompted in Bulgarian; BgGPT 3.0 (Mar 2026) claims gains, but these are vendor claims | Abstract-level |
| Bulgarian | MMLU-BG (LREC 2026) | 7 LLMs on English MMLU vs Bulgarian MMLU-BG | Numbers not obtained |
| Czech | BenCzechMark (TACL 2025), 50 tasks | Multilingual models beat Czech-specific ones; no direct English-vs-Czech comparison | Primary metadata |
| Slovene | GaMS3-12B (Mar 2026) | Self-reported win rate above 60% vs GPT-4o in a Slovene arena | Self-reported |
| South Slavic | Kuzman Pungeršek et al. 2025 | Zero-shot classification in Croatian, Serbian, Bosnian and Slovene is comparable to English | Secondary |

**Bottom line:** across the Slavic family, native-language performance is at best on par with English on large models and lower on small ones. Prompt language has a modest, task-dependent effect when the content stays native.

---

## 6. Token cost

| Source | Polish vs English |
|---|---|
| Ovcharov 2026, *Tokenizer Tax* (arXiv 2605.24718, Table 4; 6 tokenizers incl. GPT-4o and Llama 4) | Fertility **2.25 vs 1.23 tokens/word** (about 1.8×). Czech 2.28, Ukrainian 2.66 |
| Bielik v3 tokenizer paper (arXiv 2604.10799, Table 1) | Polish needs about **1.33–1.83×** the tokens of English on Gemma 3, Qwen3, Llama 3.2 and Mistral. A Polish-optimised tokenizer reverses this. |
| Lundin et al. 2025, *Token Tax* (arXiv 2509.05486) | Each extra token per word lowers accuracy by about 0.08–0.18 (tested on African languages, not Slavic ones) |

More tokens mean higher API bills, less usable context and more latency, so the same Polish prompt typically costs **30–90% more**. No primary source measures OpenAI o200k, Claude and Gemini tokenizers on the same Polish corpus. Run your own measurement with the vendors' count-tokens endpoints.

---

## 7. Practical recommendations

1. **Match the query language to the corpus language.** Cross-language RAG is the largest measured penalty.
2. **For instructions and system prompts, English is the safe default** when cost or small-model accuracy matters. Add "Respond in Polish". On frontier models, Polish prompts are fine: the gap is 0–6 points and sometimes in Polish's favour.
3. **For Polish law, medicine, culture and style, keep the content in Polish** and use a strong frontier or Polish model. The best models gain little or nothing from translation.
4. **On small or open models, let them think in English** (or translate hard inputs), then answer in Polish.
5. **Use dense or hybrid retrieval with a reranker** for Polish (Qwen3-Embedding, BGE-M3, multilingual-e5, stella-pl). Plain BM25 loses on inflection.
6. **Evaluate on your own data.** Build 50–200 real prompts with expected answers and run them in both languages. Public benchmarks rarely include Polish.

---

## 8. Method and quality control

- **Research:** 5 parallel Claude Haiku agents covered long context, search/RAG, reasoning, native-language Slavic sources and tokens/Polish benchmarks. Together they made about 165 tool calls. They searched in English, Polish, Czech, Slovak, Ukrainian, Russian, Bulgarian, Serbian, Croatian and Slovene.
- **Verification:** the lead model (Claude Opus 5.5) rechecked the key claims in three extra fetch passes against primary text:
  - OneRuler v3 HTML: sample size, the 64K/128K scope, one book per language, the Figure 3 caption, and the 11% → 34% gap
  - the EMNLP 2025 medical paper, Table 4
  - mmPISA-bench, Table 1
  - XBCP, Tables 1, 4 and 5
  - MoT-PL, Table 4
  - Anthropic's multilingual table
- **Corrections to the earlier version of this report:**
  - The "Romance languages best" quote is from Figure 3, not Figure 4.
  - arXiv 2507.07543 is about retrieval bias, not cost.
  - The Linguistic Nepotism range for Russian is 5.3–12.2 pts.
  - The Galeshchuk et al. paper is a regular UNLP paper, not a shared task.
  - The BgGPT 1.0 table values (75.08/60.51) could not be re-verified, so they were dropped.
- **Quality issues found in the agents' work:**
  - The Slavic agent relied mostly on search snippets.
  - Two agents' fetch summaries contained errors, which the verbatim text later caught. For example, one summary claimed Llama-8B was not in the medical paper, and another claimed mmPISA had no Table 1.
  - Numbers marked *secondary* above were not read in the original tables.
- **Main limitation:** Polish is missing from most large multilingual reasoning and RAG benchmarks, and there is no 2026 Polish-vs-English *prompt* study on current frontier models.

# Czy polski to najlepszy język dla LLM? Przegląd dowodów (stan na 24.11.2026)

**Werdykt: teza jest obalona.** Żadne badanie nie pokazuje, że promptowanie po polsku albo w innym języku słowiańskim daje lepsze wyniki niż po angielsku.

Nagłówki z 2025 roku wzięły się z jednego benchmarku wyszukiwania w długim kontekście (OneRuler). Ta praca w ogóle nie badała promptowania, a współautorka mówi, że różnica między polskim a angielskim nie jest istotna statystycznie. Nowsze kontrolowane badania (2025–2026) dotyczące wyszukiwania, RAG, rozumowania i prawdziwych egzaminów pokazują, że:

- **angielski jest równy albo lepszy niemal w każdym porównaniu na tym samym zadaniu**,
- na **modelach frontier** strata polskiego jest mała: 0–6 pkt, a czasem polski wygrywa o ok. 1 pkt,
- na **małych i otwartych modelach** strata jest duża: 10–20 pkt,
- polski tekst kosztuje **ok. 1,3–1,9× więcej tokenów**.

| Obszar | Co mówią najnowsze dowody | Siła dowodów |
|---|---|---|
| Pierwotna teza (OneRuler) | Polski 88% vs angielski 83,9%, tylko przy kontekście 64K–128K, średnio dla 6 modeli. Brak testu istotności, inna książka dla każdego języka. Mierzy wyszukiwanie „igły”, nie promptowanie. | Sprawdzone w publikacji; wyniki zaburzone |
| Wyszukiwanie | BM25 słabszy po polsku niż po angielsku na wszystkich 11 sparowanych zbiorach BEIR (od −2,4 do −12,5 nDCG@10) | Średnia (dane tłumaczone maszynowo) |
| RAG | Największa kara to różne języki zapytania i dokumentów (od −7 do −42 pkt Hit@20). LLM-y wolą źródła angielskie. Benchmark deep research z 2026: −16 do −23 pp na przetłumaczonym korpusie, a nawet przy idealnym wyszukiwaniu −5 do −13 pp. | Średnia–mocna; polski rzadko testowany wprost |
| Rozumowanie | Język wpływa przez rozumienie wejścia i język, w którym model myśli. Polski na modelach frontier z rozumowaniem: od −0,8 do −5,6 pkt (mmPISA, 2026). Starszy model otwarty: GSM8K 0,87 EN vs 0,69 PL. | Średnia–mocna |
| Prawdziwe polskie egzaminy (medyczne) | LEK tłumaczony przez ludzi: Llama-3.1-8B 51,3% PL vs 64,7% EN; Llama-70B 80,9 vs 82,6; **GPT-4o 90,0 PL vs 88,7 EN** | Mocna (EMNLP 2025 Findings) |
| Inne języki słowiańskie | Nigdzie brak przewagi języka natywnego; efekt natywnego promptu mały i zależny od zadania (słowacki, rosyjski, ukraiński) | Średnia; głównie źródła wtórne |
| Koszt | Polski: 2,25 tokena/słowo vs angielski 1,23 (6 tokenizerów) | Mocna |

## 1. Pierwotna teza sprawdzona w publikacji

Artykuł cryps.pl, Euronews (XI 2025), Polskie Radio i inne media oparły się na **OneRuler**: Kim, Russell, Karpinska, Iyyer, *One ruler to measure them all*, COLM 2025, arXiv 2503.01996.

Model prowadzący sprawdził bezpośrednio w tekście arXiv v3:

- **Co badano:** 7 syntetycznych zadań (warianty needle-in-a-haystack i agregacja słów) przy 8K–128K tokenów, w 26 językach.
- **Wielkość próby:** 50 przykładów na konfigurację, czyli 5,2 tys. promptów na zadanie i model.
- **Liczby z nagłówków:** *„at context lengths of 64K and 128K, we unexpectedly observe that Polish is the top performer on NIAH tasks”* (88% średnio dla wszystkich modeli). Angielski to *„only the 6th best language out of the 26”*, z wynikiem 83,9%. Chiński jest 4. od końca (62,1%).
- **Jedna książka na język:** *„26 open-domain non-copyrighted books, one per language”*. Dla polskiego były to *Noce i dnie*, dla angielskiego *Małe kobietki*, więc tekst tła różni się stylem, epoką i długością. Już samo to wystarcza, żeby różnicy 4 pkt nie dało się zinterpretować.
- **Ogólnie prowadzą języki romańskie.** Podpis rys. 3: *„Romance languages perform best across all context lengths, along with Polish and Russian.”* (Poprzednia wersja raportu przypisywała ten cytat rys. 4; poprawione.)
- **Język instrukcji waży więcej niż różnica 4 pkt.** Sam język instrukcji zmienia trafność nawet o ok. 20 pkt. Przykład: angielski kontekst przy 64K spada z 91% do 71% z instrukcją po koreańsku.
- **Brak testu istotności** dla różnic między językami.

**Co mówi współautorka** (Nauka w Polsce / PAP, 27.11.2025): różnica nie była istotna statystycznie, a badanie nie dotyczyło promptowania; *„na pewno nie możemy wnioskować”* na jego podstawie, że polski jest najlepszy do promptowania. To samo sprostowanie podał Spider's Web.

**Co od tamtej pory (2025–2026):** nie znaleziono żadnej replikacji „polskiego zwycięstwa”. Nowsze benchmarki długiego kontekstu albo pomijają polski, albo stawiają angielski na czele:

- MLRBench (EACL 2026): modele wykorzystują poniżej 30% deklarowanego kontekstu.
- MGAL (ICML 2026): obejmuje 6 języków ONZ, więc jedynym słowiańskim jest rosyjski.

## 2. Wyszukiwanie, retrieval i RAG

**Klasyczny retrieval.** BEIR vs BEIR-PL (Wojtasik i in., LREC-COLING 2024, tab. 3) to porównanie na zbiorach tłumaczonych maszynowo.

- BM25 nDCG@10 jest niższy po polsku na **wszystkich 11 sparowanych zbiorach**. Różnica wynosi od 2,4 do 12,5 pkt (NQ −12,5, HotpotQA −11,0). Średnio ok. 35,7 vs 42,4; tę średnią wyliczyliśmy sami, nie podaje jej publikacja.
- Autorzy tłumaczą to fleksją polszczyzny, na której traci wyszukiwanie leksykalne. Dlatego po polsku bardziej liczą się lematyzacja i wyszukiwanie dense lub hybrydowe.

**Polskie embeddery są dobre w obrębie polskiego.**

- Na PL-MTEB (ACL 2026 Findings) najlepszą średnią ma Qwen3-Embedding-8B (70,47).
- Najlepszy wynik w samym retrievalu ma polski stella-pl-retrieval-8k: 61,59 vs 59,21.
- Na PIRB (41 polskich zadań) multilingual-e5-large osiąga średnio 57,29.
- Żaden z tych benchmarków nie mierzy różnicy między językami.

**Zachowanie wielojęzycznego RAG:**

- **Linguistic Nepotism** (Ki i in., ICML 2026): modele cytują dokumenty angielskie, nawet gdy są mniej trafne. Dla rosyjskiego, jedynego badanego języka słowiańskiego, trafność cytowań spada o 5,3–12,2 pkt względem angielskiego w sześciu otwartych modelach.
- **Park & Lee 2025:** retrievery wolą języki wysokozasobowe i język zapytania. Przykład: recall bge-m3 po rosyjsku 45,05 vs po angielsku 56,03.
- **The Cross-Lingual Cost** (arXiv 2507.07543; chodzi o *bias* retrievalu, nie o pieniądze):
  - w prawniczym RAG arabsko-angielskim różne języki zapytania i dokumentów kosztują 7–42 pkt Hit@20 (M-E5: 88 w tym samym języku vs 46 między językami),
  - zbalansowany retrieval odzyskuje ok. 91–94% tej straty.
- **NOWE: XBCP** (*Cross-Lingual BrowseComp-Plus*, Lu i in., arXiv 2606.15345, VI 2026, preprint) testuje agentów deep research na przetłumaczonych dokumentach. Obejmuje 12 języków, żadnego słowiańskiego.
  - Z Qwen3-Embedding-8B trafność spada o ok. **16–23 pp**, gdy korpus jest przetłumaczony.
  - Najlepszy system (DeepSeek-V4-Pro): 64,7 na oryginalnym korpusie vs 42,3 między językami.
  - **Nawet z idealnymi (oracle) dowodami** spadek wynosi 4,7–12,8 pp. Model gorzej *czyta* dokumenty w innym języku, a nie tylko gorzej je znajduje.
- **Polski RAG w 2026** jest badany (Bartanowicz i Jassem, LREC 2026; Smits i Walkowiak, EACL 2026 SRW), ale nie udało się otworzyć liczb, więc ich nie cytujemy. Ostatnie zadanie retrievalowe PolEval jest z 2022 roku.

**Wniosek:** nic nie wspiera tezy „polski jest najlepszy do wyszukiwania i RAG”. Mierzalnym czynnikiem jest **spójność językowa**. Zadawaj pytania w języku korpusu, używaj wielojęzycznego lub polskiego embeddera z rerankerem i licz się z tym, że w mieszanym indeksie generator będzie wolał źródła angielskie.

## 3. Czy język może zmienić poziom rozumowania LLM?

**Tak, przez dwa mechanizmy: to, jak dobrze model *rozumie* wejście, oraz to, w jakim języku model *myśli*. Dla języków wysokozasobowych, takich jak polski, efekt jest mały na modelach frontier i duży na małych. Żadne badanie nie pokazuje, by język słowiański *podnosił* rozumowanie powyżej angielskiego.**

| Badanie | Ustawienie | Wynik |
|---|---|---|
| **mmPISA-bench** (Sapenov i Savelka, CMU, arXiv 2606.07069, VI 2026) **NOWE** | 25 zadań PISA, oficjalne tłumaczenia ludzkie na 43 języki, 5 powtórzeń | **Claude Opus 4.5 (wysoki effort): EN 100,0 vs PL 94,4. GPT-5.1 (wysoki): EN 96,8 vs PL 96,0. GPT-5.1 (bez rozumowania): PL 78,4 > EN 76,8.** Wysiłek rozumowania podnosi średnią ze wszystkich języków z 78,9 do 95,7 (GPT). |
| Thellmann i in. 2024, EU20 | Llama-3.1-70B, tłumaczenie DeepL | GSM8K **EN 0,87 vs PL 0,69, CS 0,75** |
| PolyMath (NeurIPS 2025) | 18 języków, bez polskiego | Modele z rozumowaniem prowadzą łańcuch myśli w języku wejścia tylko w 34–43% przypadków (modele bez rozumowania: 99%+). Qwen3-235B z myśleniem: RU ≈ EN (77,6 vs 76,8 na poziomie średnim). |
| Tam i in. 2025, *Language Matters* | MATH-500, wymuszone myślenie po angielsku vs w języku natywnym | Angielski prefill pomaga w suahili średnio o +31,5 pp, w rosyjskim o +5,1, a dla Qwen3/QwQ po rosyjsku tylko o +0,6 |
| Barua i in. (ICLR 2026) | Długie łańcuchy myśli, modele 32B | Wymuszenie rozumowania w języku docelowym kosztuje średnio 28,8%; AIME 65,5 (CoT po angielsku) vs 24,7 (CoT w języku docelowym), Nemotron-49B |
| Saji i in. 2025, *Reasoning Lingua Franca* | MGSM, GPQA Diamond | Rozumowanie w języku natywnym obniża trafność, mocniej dla języków niskozasobowych (liczby per język tylko na wykresach) |
| Yong i in. 2025 | s1-14B | Rozumowanie po rosyjsku 92,4 = po angielsku 92,4 |
| Liu i in. (NAACL 2025) | ChatGPT | Tłumaczenie na angielski pomaga w matematyce dla języków niskozasobowych; prompty natywne lepsze w zadaniach kulturowych |

**Interpretowalność** wskazuje to samo: Wendler i in. (ACL 2024), *Semantic Hub* (ICLR 2025) i *Tracing the thoughts* Anthropic (2025). Modele mają wspólną, w dużej mierze niezależną od języka przestrzeń pojęć, która rośnie wraz z rozmiarem modelu. Dlatego na większych modelach język promptu znaczy mniej.

**Tabele dostawców:**

- Tabela Global-MMLU Anthropic (pobrana 24.11.2026) daje każdemu wymienionemu językowi **98,5–99,8% wyniku angielskiego** dla Claude Fable 5.2 i 96,3–99,3% dla Opus 5.5. **Polskiego nie ma w tabeli.**
- OpenAI MMMLU obejmuje 14 lokalizacji, bez polskiego.

**Efekt uboczny:** dla rosyjskiego skuteczność ataków wynosiła 16,1% przy promptach rosyjskich vs 11,5% przy angielskich (Tam i in., tab. 3). Zabezpieczenia mogą działać słabiej poza angielskim.

## 4. Bezpośrednie dane dla polskiego (te same pytania PL vs EN)

**Polish–English medical knowledge transfer** (Grzybowski i in., UAM, *Findings of EMNLP 2025*, arXiv 2412.00559) to **najlepsze znalezione badanie dla polskiego**. Wykorzystuje polskie egzaminy lekarskie z **profesjonalnymi tłumaczeniami na angielski wykonanymi przez ludzi** (tab. 4):

| Model | LEK PL | LEK EN | LDEK PL | LDEK EN |
|---|---|---|---|---|
| Llama-3.1-8B | 51,25 | 64,69 | 41,06 | 47,71 |
| Llama-3.1-70B | 80,94 | 82,60 | 61,75 | 63,17 |
| GPT-4o | **89,96** | 88,69 | **73,89** | 72,51 |
| GPT-4o-mini | 75,88 | 75,92 | 54,94 | 56,88 |
| Qwen2.5-72B | 76,87 | 81,93 | 58,35 | 63,33 |
| Mistral-Large-2407 | 76,75 | 82,40 | 56,29 | 62,14 |
| Bielik-11B-v2.2 | **62,36** | 56,98 | **43,20** | 42,88 |

Dwie rzeczy rzucają się w oczy:

- **Llama-3.1-8B wyraźnie przegrywa po polsku.** Zdała jeden LEK po polsku, ale wszystkie 13 po angielsku.
- **GPT-4o i polski Bielik radzą sobie lepiej po polsku.** Autorzy: *„language transfer is more effective as the model's general performance improves”*.

Inne dane dla polskiego:

- **LLMzSzŁ** (arXiv 2501.02266, ok. 19 tys. pytań z polskich egzaminów): modele rzędu 70B parametrów wypadają podobnie po polsku i po angielsku, a małe najlepiej w swoim głównym języku treningowym.
- **PLCC** (600 pytań o polską kulturę, 2025): prowadzą wielojęzyczne modele frontier. Gemini-Exp-1206 ma 83,0, Claude 3.5 Sonnet 82,7, GPT-4o 81,3, a Bielik-2.3 62,2. To miara *wiedzy* o Polsce, nie języka promptu.
- **MoT-PL** (Politechnika Wrocławska, ICCS 2026): douczenie polskich modeli na polskich śladach rozumowania poprawiło rozumowanie po polsku, ale *pogorszyło* je po angielsku (do −45% względnie na LightR1). To kompromis pojemności modelu, nie dowód wyższości polskiego.

## 5. Inne języki słowiańskie (wyszukiwanie w ich własnych językach)

Wykonaliśmy ok. 44 zapytań w językach natywnych: czeskim, słowackim, ukraińskim, rosyjskim, bułgarskim, serbskim, chorwackim, słoweńskim i polskim.

Serbski i chorwacki dostały po 3–4 zapytania ze względu na budżet. Zwróciły tylko benchmarki modeli enkoderowych, więc te dwa języki pozostają luką.

| Ukraiński | Praca UNLP 2026 o korekcie gramatyki | Prompty ukraińskie najlepsze w korekcie gramatyki; w zero-shot tylko Claude zyskał na instrukcjach po ukraińsku | Wtórna (streszczenie) |

| Rosyjski | Prasa rosyjska (kod.ru, 3dnews) | Powtórzyła ranking OneRuler ze **sprzecznymi liczbami** | Tylko prasa |
| Słowacki | Harvan / Kopčan i in., LoResNLP 2025 | Natywne prompty słowackie dają mały zysk zależny od zadania; instrukcje ważniejsze niż język | Wtórna |

| Bułgarski | MMLU-BG (LREC 2026) | 7 LLM-ów na angielskim MMLU vs bułgarskim MMLU-BG | Nie uzyskano liczb |
| Czeski | BenCzechMark (TACL 2025), 50 zadań | Modele wielojęzyczne wygrywają z czeskimi; brak bezpośredniego porównania z angielskim | Metadane pierwotne |

**Wniosek:** w całej rodzinie słowiańskiej wyniki w języku natywnym są w najlepszym razie równe angielskim na dużych modelach i niższe na małych. Gdy treść pozostaje w języku natywnym, język promptu ma umiarkowany wpływ, zależny od zadania.

## 6. Koszt tokenów

| Źródło | Polski vs angielski |
|---|---|
| Ovcharov 2026, *Tokenizer Tax* (arXiv 2605.24718, tab. 4; 6 tokenizerów, m.in. GPT-4o i Llama 4) | **2,25 vs 1,23 tokena na słowo** (ok. 1,8×); czeski 2,28, ukraiński 2,66 |
| Publikacja o tokenizerze Bielik v3 (arXiv 2604.10799, tab. 1) | Polski potrzebuje ok. **1,33–1,83×** tokenów angielskiego w Gemma 3, Qwen3, Llama 3.2 i Mistral; tokenizer zoptymalizowany pod polski odwraca tę proporcję |
| Lundin i in. 2025, *Token Tax* (arXiv 2509.05486) | Każdy dodatkowy token na słowo obniża trafność o ok. 0,08–0,18 (badane języki afrykańskie, nie słowiańskie) |

Więcej tokenów to wyższy rachunek za API, mniej użytecznego kontekstu i większe opóźnienie. Ten sam prompt po polsku kosztuje zwykle **30–90% więcej**. Żadne źródło pierwotne nie mierzy tokenizerów OpenAI o200k, Claude i Gemini na tym samym polskim korpusie. Zmierz to sam przez endpointy count-tokens dostawców.

## 7. Rekomendacje praktyczne

1. **Pytaj w języku korpusu.** Różne języki zapytania i dokumentów to największa zmierzona kara w RAG.
2. **Instrukcje i system prompt pisz domyślnie po angielsku**, gdy liczy się koszt albo trafność małego modelu, i dodaj „Odpowiadaj po polsku”. Na modelach frontier polskie prompty są w porządku: różnica to 0–6 pkt, czasem na korzyść polskiego.
3. **Prawo, medycynę, kulturę i styl zostaw po polsku** i użyj mocnego modelu frontier albo polskiego. Najlepsze modele niewiele albo nic nie zyskują na tłumaczeniu.
4. **Małym i otwartym modelom pozwól myśleć po angielsku** (albo tłumacz trudne wejścia), a odpowiedź niech podają po polsku.
5. **Do polskiego używaj wyszukiwania dense lub hybrydowego z rerankerem** (Qwen3-Embedding, BGE-M3, multilingual-e5, stella-pl). Sam BM25 traci na fleksji.
6. **Testuj na własnych danych.** Przygotuj 50–200 prawdziwych promptów z oczekiwanymi odpowiedziami i uruchom je w obu językach. Publiczne benchmarki rzadko obejmują polski.

## 8. Metoda i kontrola jakości

- **Research:** 5 równoległych agentów Claude Haiku zajęło się długim kontekstem, wyszukiwaniem/RAG, rozumowaniem, źródłami słowiańskimi w językach natywnych oraz tokenami i polskimi benchmarkami. Razem wykonali ok. 165 wywołań narzędzi. Szukali po angielsku, polsku, czesku, słowacku, ukraińsku, rosyjsku, bułgarsku, serbsku, chorwacku i słoweńsku.
- **Weryfikacja:** model prowadzący (Claude Opus 5.5) w trzech dodatkowych przebiegach sprawdził kluczowe tezy w tekstach źródłowych:
  - OneRuler v3 HTML: wielkość próby, zakres 64K/128K, jedna książka na język, podpis rys. 3 i wzrost luki z 11% do 34%,
  - publikacja medyczna z EMNLP 2025, tab. 4,
  - mmPISA-bench, tab. 1,
  - XBCP, tab. 1, 4 i 5,
  - MoT-PL, tab. 4,
  - tabela wielojęzyczności Anthropic.
- **Poprawki względem wcześniejszej wersji raportu:**
  - Cytat o językach romańskich pochodzi z rys. 3, nie z rys. 4.
  - arXiv 2507.07543 dotyczy biasu retrievalu, nie kosztu.
  - Zakres Linguistic Nepotism dla rosyjskiego to 5,3–12,2 pkt.
  - Praca Galeshchuk i in. to zwykła publikacja UNLP, nie shared task.
  - Wartości z tabeli BgGPT 1.0 (75,08/60,51) nie dało się ponownie zweryfikować, więc je usunięto.
- **Problemy jakościowe w pracy agentów:**
  - Agent słowiański opierał się głównie na fragmentach z wyników wyszukiwania.
  - Streszczenia generowane przez narzędzie fetch u dwóch agentów zawierały błędy, które wyszły dopiero przy dosłownym tekście. Przykład: jedno twierdziło, że Llama-8B nie występuje w pracy medycznej, inne, że mmPISA nie ma tab. 1.
  - Liczby oznaczone powyżej jako *wtórne* nie zostały odczytane z oryginalnych tabel.
- **Główne ograniczenie:** polskiego brakuje w większości dużych wielojęzycznych benchmarków rozumowania i RAG. Nie ma też badania z 2026 roku porównującego *prompty* po polsku i po angielsku na obecnych modelach frontier.

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function () {
  var eyebrow = { en: "Evidence review · 24 Nov 2026", pl: "Przegląd dowodów · 24.11.2026" };
  function render(lang) {
    var src = document.getElementById("md-" + lang).textContent;
    var el = document.getElementById("doc-" + lang);
    if (window.marked) {
      el.innerHTML = marked.parse(src);
      el.querySelectorAll("table").forEach(function (t) {
        var wrap = document.createElement("div"); wrap.className = "tbl";
        t.parentNode.insertBefore(wrap, t); wrap.appendChild(t);
      });
      el.querySelectorAll("a[href^='http']").forEach(function (a) { a.target = "_blank"; a.rel = "noopener"; });
    } else {
      el.innerHTML = ""; var pre = document.createElement("div"); pre.className = "fallback"; pre.textContent = src; el.appendChild(pre);
    }
  }
  function show(lang) {
    ["en", "pl"].forEach(function (l) {
      document.getElementById("doc-" + l).hidden = l !== lang;
      document.getElementById("btn-" + l).setAttribute("aria-pressed", String(l === lang));
    });
    document.documentElement.lang = lang;
    document.getElementById("eyebrow").textContent = eyebrow[lang];
    try { localStorage.setItem("report-lang", lang); } catch (e) {}
  }
  render("en"); render("pl");
  var start = "en";
  try { start = localStorage.getItem("report-lang") || start; } catch (e) {}
  if (location.hash === "#pl" || location.hash === "#en") start = location.hash.slice(1);
  show(start === "pl" ? "pl" : "en");
  document.querySelectorAll(".switch button").forEach(function (b) {
    b.addEventListener("click", function () { show(b.dataset.lang); window.scrollTo(0, 0); });
  });
})();
</script>
