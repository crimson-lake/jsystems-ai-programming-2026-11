# Application tests for app/ (ADR-000 section 10).
# - build-and-test: ./mvnw verify = Angular build + Vitest, backend unit tests (Surefire) and ITs (Failsafe,
#   WireMock, dummy key), JaCoCo check. No OpenRouter key, runs on every PR touching the app.
# - e2e: Playwright against the real JAR and real OpenRouter (paid). Runs on push to main, on manual dispatch and
#   on PRs labelled run-e2e (every push to such a PR re-runs it; remove the label to stop). Fork PRs never run it.
#   Needs Actions secret OPENROUTER_API_KEY and Actions variable LLM_MODEL (e.g. openai/gpt-6-luna).
# Evals (tag eval) and captures (tag capture) are not run here: evals are expensive, captures rewrite fixtures.
name: App tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'app/**'
      - 'docs/policies/**'
      - 'assets/example-images/**'
      - '.github/workflows/app-tests.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'docs/policies/**'
      - 'assets/example-images/**'
      - '.github/workflows/app-tests.yml'
  workflow_dispatch:
    inputs:
      e2e:
        description: Also run E2E against real OpenRouter (paid)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Adding an unrelated label must not cancel a running test run.
  group: app-tests-${{ (github.event.action == 'labeled' && github.event.label.name != 'run-e2e') && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit and integration tests
    if: github.event.action != 'labeled' || github.event.label.name == 'run-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: app/backend/pom.xml

      # Node for the Angular build is downloaded into target/ by frontend-maven-plugin (pom.xml node.version).
      - name: Maven verify
        working-directory: app/backend
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/backend/target/surefire-reports/
            app/backend/target/failsafe-reports/
            app/backend/target/site/jacoco/
          retention-days: 7

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: app/backend/target/*.jar
          retention-days: 1

  e2e:
    name: E2E on real stack
    needs: build-and-test
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.e2e) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'run-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      E2E_BASE_URL: http://localhost:8080
      E2E_BAD_KEY_URL: http://localhost:8081
      # Outside app/e2e/test-results/, which Playwright empties at the start of a run.
      E2E_APP_LOG: ${{ github.workspace }}/e2e-logs/app.log
    steps:
      - name: Check configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${OPENROUTER_API_KEY:-}" ]] || { echo '::error::Set Actions secret OPENROUTER_API_KEY.'; exit 1; }
          [[ -n "${LLM_MODEL:-}" ]] || { echo '::error::Set Actions variable LLM_MODEL, e.g. openai/gpt-6-luna.'; exit 1; }

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: ${{ runner.temp }}/jar

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/e2e/package-lock.json

      - name: Install Playwright
        working-directory: app/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Plan section 4.5: real key on :8080, a second instance with an invalid key on :8081 for the error banner.
      - name: Start application
        shell: bash
        run: |
          set -euo pipefail
          jar=$(ls "$RUNNER_TEMP"/jar/*.jar | grep -v -- '-plain.jar$' | head -n1)
          mkdir -p "$(dirname "$E2E_APP_LOG")"
          LOGGING_FILE_NAME="$E2E_APP_LOG" SERVER_PORT=8080 \
            nohup java -jar "$jar" > "$RUNNER_TEMP/app-console.log" 2>&1 &
          OPENROUTER_API_KEY=invalid SERVER_PORT=8081 \
            nohup java -jar "$jar" > "$RUNNER_TEMP/app-bad-key.log" 2>&1 &
          for port in 8080 8081; do
            for _ in $(seq 1 60); do
              curl -fsS "http://localhost:$port/actuator/health" > /dev/null && break
              sleep 2
            done
            curl -fsS "http://localhost:$port/actuator/health" || { echo "::error::App on :$port did not start"; tail -n 50 "$RUNNER_TEMP"/app-*.log; exit 1; }
            echo
          done

      - name: Run Playwright
        working-directory: app/e2e
        run: npx playwright test

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            app/e2e/test-results/
            e2e-logs/
            ${{ runner.temp }}/app-*.log
          retention-days: 7
