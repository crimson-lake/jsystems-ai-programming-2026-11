# Fixed Polish texts for the "Zmiana decyzji" reason when a guardrail sets the label (ADR-001 section 3.4).
G1=Zdjęcie lub opis wskazują na możliwe zagrożenie bezpieczeństwa, dlatego sprawę oceni specjalista.
G2=Od zakupu minęło więcej niż 30 dni, więc zwrot jest poza terminem.
G3=Od zakupu minęło więcej niż 2 lata, więc reklamacja jest poza okresem odpowiedzialności sklepu.
G4.photo=Na podstawie zdjęcia nie da się ocenić urządzenia, dlatego potrzebujemy dodatkowych informacji.
G4.category=Urządzenie na zdjęciu nie pasuje do wybranej kategorii, dlatego potrzebujemy dodatkowych informacji.
G5=Na podstawie zdjęcia nie da się jednoznacznie ustalić przyczyny uszkodzenia, dlatego sprawę oceni specjalista.
G6=Nie udało się jednoznacznie dopasować sprawy do zasad, dlatego oceni ją specjalista.
model.default=Na podstawie nowych informacji zmieniliśmy ocenę Twojego zgłoszenia.
